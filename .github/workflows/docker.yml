# Bouwt het Docker-image en start het met PostgreSQL (docker-compose.yml),
# zoals bij een zelf gehoste installatie. Slaagt pas als /api/gezondheid in
# orde is (configuratie, database, migraties, mailsleutel), de pagina's laden
# en de back-upcommando's uit docs/installatie.md werken.

name: Docker-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - package.json
      - package-lock.json
      - next.config.ts
      - src/**
      - public/**
      - .github/workflows/docker.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bouwen-en-testen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Testinstellingen
        run: |
          {
            # Bewust met tekens die in een adres niet mogen (/ # ? %41).
            echo "POSTGRES_PASSWORD=ci/#?%41x-$(openssl rand -hex 12)"
            echo "SITE_URL=http://localhost:3000"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 36 | tr -d '\n')"
            echo "MAIL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')"
          } > .env

      - name: Bouwen en starten
        run: docker compose up -d --build

      - name: Wachten tot de installatie gezond is
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/api/gezondheid; then echo; exit 0; fi
            sleep 5
          done
          echo "Niet gezond geworden"; curl -s http://localhost:3000/api/gezondheid; exit 1

      - name: Pagina's controleren
        run: |
          for pad in /inloggen /registreren /status /wachtwoord-vergeten; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$pad")
            echo "$pad -> $code"
            test "$code" = "200"
          done
          # Zonder login: doorsturen naar /inloggen en geen bestanden.
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/artikelen)" = "307"
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/bestanden/articles/a/b.png)" = "401"
          # Draait als niet-root-gebruiker, en die mag in het bestandenvolume schrijven.
          test "$(docker compose exec -T app id -un)" = "node"
          docker compose exec -T app sh -c 'echo test > /data/bestanden/.schrijftest && rm /data/bestanden/.schrijftest'

      - name: Back-up zoals in docs/installatie.md
        run: |
          # Iets om terug te vinden: een tag en een bestand.
          docker compose exec -T db psql -U kennisbank -d kennisbank -c "INSERT INTO tags (name, slug) VALUES ('Back-uptest', 'back-uptest')"
          docker compose exec -T app sh -c 'mkdir -p /data/bestanden/articles/ci && echo hallo > /data/bestanden/articles/ci/test.txt'
          docker compose exec -T db pg_dump -U kennisbank -Fc -f /tmp/kennisbank.dump kennisbank
          docker compose cp db:/tmp/kennisbank.dump kennisbank.dump
          docker compose exec -T app tar czf /tmp/bestanden.tgz -C /data/bestanden .
          docker compose cp app:/tmp/bestanden.tgz bestanden.tgz
          # Het dumpbestand moet leesbaar zijn (inhoudsopgave zonder fout).
          docker compose exec -T db pg_restore -l /tmp/kennisbank.dump | grep -q "TABLE public articles"
          test "$(head -c 5 kennisbank.dump)" = "PGDMP"
          tar tzf bestanden.tgz > /dev/null

      - name: Terugzetten zoals in docs/installatie.md
        run: |
          # Gegevens "kwijtraken", en de back-up streng afschermen zoals een voorzichtige beheerder doet.
          docker compose exec -T db psql -U kennisbank -d kennisbank -c "DELETE FROM tags"
          docker compose exec -T app rm -rf /data/bestanden/articles
          chmod 600 kennisbank.dump bestanden.tgz
          docker compose stop app
          docker compose cp kennisbank.dump db:/tmp/kennisbank.dump
          docker compose exec -T db pg_restore -U kennisbank -d kennisbank --clean --if-exists /tmp/kennisbank.dump
          docker compose start app
          docker compose cp bestanden.tgz app:/tmp/bestanden.tgz
          docker compose exec -T -u root app chown node:node /tmp/bestanden.tgz
          docker compose exec -T app tar xzf /tmp/bestanden.tgz -C /data/bestanden
          # Alles terug, en de installatie weer gezond.
          test "$(docker compose exec -T db psql -U kennisbank -d kennisbank -tAc "SELECT count(*) FROM tags WHERE slug = 'back-uptest'")" = "1"
          test "$(docker compose exec -T app cat /data/bestanden/articles/ci/test.txt)" = "hallo"
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/api/gezondheid; then echo; exit 0; fi
            sleep 2
          done
          echo "Niet gezond na het terugzetten"; exit 1

      - name: Logboek
        if: always()
        run: docker compose logs --tail 200

      - name: Opruimen
        if: always()
        run: docker compose down -v; rm -f .env kennisbank.dump bestanden.tgz
