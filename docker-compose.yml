# Kennisbank zelf hosten: de app + PostgreSQL op één server.
#
#   1. cp .env.docker.example .env      en vul de waarden in
#   2. docker compose up -d --build
#   3. open SITE_URL, ga naar /registreren: de eerste gebruiker wordt beheerder
#
# Zie docs/installatie.md voor de volledige uitleg (reverse proxy, back-ups,
# bijwerken).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kennisbank
      POSTGRES_USER: kennisbank
      # Geldt alleen bij de allereerste start (zolang het volume db-data leeg is).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      # Nederlandse sortering (ICU nl-NL) en een echte tekenset voor het zoeken.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=nl-NL --locale=C.UTF-8"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Via TCP: tijdens de eerste initialisatie luistert Postgres even alleen
      # op een lokale socket, en dat telt dan nog niet als klaar.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kennisbank -d kennisbank"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: kennisbank:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Achter een reverse proxy op dezelfde server: POORT=127.0.0.1:3000 in .env,
      # zodat niemand de proxy kan overslaan (Docker omzeilt de firewall van de host).
      - "${POORT:-3000}:3000"
    environment:
      DB_DIALECT: postgres
      # Het wachtwoord apart (PGPASSWORD) en niet in het adres: tekens als
      # / # ? % in het wachtwoord zouden het adres anders ongeldig maken.
      DATABASE_URL: postgres://kennisbank@db:5432/kennisbank
      PGPASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      # Verkeer tussen app en database blijft binnen Docker: geen TLS nodig.
      DATABASE_SSL: "off"
      AUTH_DRIVER: local
      STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
      STORAGE_DIR: /data/bestanden
      REGISTRATIE: ${REGISTRATIE:-uitnodiging}
      DB_AUTO_MIGRATE: "true"
      SITE_URL: ${SITE_URL:?zet SITE_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?zet BETTER_AUTH_SECRET in .env}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?zet MAIL_ENCRYPTION_KEY in .env}
      # Herkenbaar maken (optioneel): naam, kleur en logo van deze kennisbank.
      INSTALLATIE_NAAM: ${INSTALLATIE_NAAM:-}
      INSTALLATIE_KLEUR: ${INSTALLATIE_KLEUR:-}
      INSTALLATIE_LOGO: ${INSTALLATIE_LOGO:-}
      INSTALLATIE_AFKORTING: ${INSTALLATIE_AFKORTING:-}
    volumes:
      - bestanden:/data/bestanden

volumes:
  db-data:
  bestanden:
